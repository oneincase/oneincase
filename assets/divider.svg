<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="divider">
  <style>
    @keyframes slide{0%{transform:translateX(-140px)}100%{transform:translateX(1340px)}}
    @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
    .s{animation:slide 7s linear infinite}
    .b{animation:breathe 3.2s ease-in-out infinite}
  </style>
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".18" stop-color="#00E5FF" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#FF2E97" stop-opacity=".95"/>
      <stop offset=".82" stop-color="#00E5FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF6FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#EAF6FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#EAF6FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="dclip"><rect width="1200" height="34"/></clipPath>
  </defs>
  <g clip-path="url(#dclip)">
    <rect x="0" y="16" width="1200" height="1.5" fill="url(#dline)"/>
    <rect class="s" x="0" y="14" width="140" height="6" fill="url(#dbeam)"/>
    <g fill="#00E5FF">
      <rect x="596" y="11" width="8" height="8" transform="rotate(45 600 15)"/>
      <rect x="1158" y="13" width="5" height="5" opacity=".8"/>
      <rect x="37" y="13" width="5" height="5" opacity=".8"/>
    </g>
    <g fill="#FF2E97">
      <rect class="b" x="600" y="13" width="4" height="4"/>
      <rect x="18" y="12" width="12" height="2" opacity=".7"/>
      <rect x="1170" y="12" width="12" height="2" opacity=".7"/>
    </g>
  </g>
</svg>
